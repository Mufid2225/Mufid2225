name: Update GitAscii

on:
  workflow_dispatch:
  schedule:
    - cron: '55 9 * * *'

permissions:
  contents: write

concurrency:
  group: gitascii-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Generate and Publish GitAscii SVGs
        uses: Igorcbraz/GitAscii/action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gitascii branch
        uses: actions/checkout@v4
        with:
          ref: gitascii
          path: .gitascii

      - name: Patch generated SVGs
        run: node .github/scripts/patch-profile-svg.mjs .gitascii/profiles/default
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit patched SVGs
        working-directory: .gitascii
        run: |
          if git diff --quiet; then
            echo "No SVG changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profiles/
          git commit -m "chore: patch profile SVG name size and starred metric [skip ci]"
          git push
